<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ArtiCRAFT Bot Panel - Game Mode</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #000;
        color: #fff;
        font-family: Consolas, "Courier New", monospace;
        overflow: hidden;
      }
      main {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      
      /* Viewer */
      #viewerFrame {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        border: 0; background: #050706;
      }
      
      /* Overlays */
      #pointerOverlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        z-index: 10; cursor: crosshair;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        background: rgba(0,0,0,0.5); color: white;
        text-shadow: 2px 2px 0 #000; font-weight: bold; gap: 10px;
      }
      #pointerOverlay .title { font-size: 24px; }
      #pointerOverlay .subtitle { font-size: 14px; font-weight: normal; }
      
      #crosshair {
        display: none; position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%); color: rgba(255,255,255,0.8);
        font-size: 24px; pointer-events: none; text-shadow: 1px 1px 0 #000; z-index: 11;
      }

      /* Chat */
      .chat-panel {
        position: absolute; bottom: 20px; left: 20px;
        width: 400px; height: 300px; z-index: 10000;
        display: flex; flex-direction: column;
        pointer-events: none;
      }
      #chat {
        flex: 1; overflow-y: auto; padding: 12px;
        text-shadow: 1px 1px 0 #000;
        mask-image: linear-gradient(to bottom, transparent, black 10%);
        -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%);
        pointer-events: auto;
      }
      .message { display: flex; gap: 8px; padding: 2px 0; font-size: 14px; }
      .source { display: none; }
      .text { word-break: break-word; white-space: pre-wrap; color: white; }
      
      #chatForm {
        display: none; padding: 8px; background: rgba(0,0,0,0.7); pointer-events: auto;
      }
      #chatInput {
        flex: 1; min-height: 36px; background: rgba(0,0,0,0.5); border: 1px solid #555;
        color: white; padding: 0 8px; font-family: inherit; font-size: 14px; outline: none;
      }
      #chatInput:focus { border-color: white; }

      /* Scoreboard */
      .mc-scoreboard-container {
        position: absolute; top: 50%; right: 20px;
        transform: translateY(-50%); z-index: 10000;
        pointer-events: none;
      }
      .mc-scoreboard {
        background: rgba(0, 0, 0, 0.5); padding: 6px; width: 100%; max-width: 320px;
        font-size: 14px; line-height: 1.2;
      }
      .mc-score-title { text-align: center; color: #FFAA00; margin-bottom: 6px; font-weight: bold; }
      .mc-score-line { display: flex; justify-content: space-between; margin: 2px 0; color: white; white-space: pre-wrap; }
      .mc-score-name { flex: 1; }
      .mc-score-value { color: #FF5555; margin-left: 8px; text-align: right; }

      /* MC Colors */
      .mc-color-0 { color: #000000; text-shadow: 1px 1px 0px #000000; }
      .mc-color-1 { color: #0000AA; text-shadow: 1px 1px 0px #00002A; }
      .mc-color-2 { color: #00AA00; text-shadow: 1px 1px 0px #002A00; }
      .mc-color-3 { color: #00AAAA; text-shadow: 1px 1px 0px #002A2A; }
      .mc-color-4 { color: #AA0000; text-shadow: 1px 1px 0px #2A0000; }
      .mc-color-5 { color: #AA00AA; text-shadow: 1px 1px 0px #2A002A; }
      .mc-color-6 { color: #FFAA00; text-shadow: 1px 1px 0px #2A2A00; }
      .mc-color-7 { color: #AAAAAA; text-shadow: 1px 1px 0px #2A2A2A; }
      .mc-color-8 { color: #555555; text-shadow: 1px 1px 0px #151515; }
      .mc-color-9 { color: #5555FF; text-shadow: 1px 1px 0px #15153F; }
      .mc-color-a { color: #55FF55; text-shadow: 1px 1px 0px #153F15; }
      .mc-color-b { color: #55FFFF; text-shadow: 1px 1px 0px #153F3F; }
      .mc-color-c { color: #FF5555; text-shadow: 1px 1px 0px #3F1515; }
      .mc-color-d { color: #FF55FF; text-shadow: 1px 1px 0px #3F153F; }
      .mc-color-e { color: #FFFF55; text-shadow: 1px 1px 0px #3F3F15; }
      .mc-color-f { color: #FFFFFF; text-shadow: 1px 1px 0px #3F3F3F; }
      .mc-format-l { font-weight: bold; }
      .mc-format-o { font-style: italic; }
      .mc-format-n { text-decoration: underline; }
      .mc-format-m { text-decoration: line-through; }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
    </style>
  </head>
  <body>
    <main>
      <iframe id="viewerFrame" title="Bot 3D viewer"></iframe>
      
      <div id="pointerOverlay">
        <div class="title" id="overlayTitle">O'ynash uchun ekranga bosing</div>
        <div class="subtitle">Chiqish uchun ESC, chat uchun T tugmasini bosing</div>
      </div>
      
      <div id="crosshair">+</div>

      <section class="chat-panel">
        <div id="chat"></div>
        <form id="chatForm">
          <input id="chatInput" autocomplete="off" maxlength="256" placeholder="Chatga xabar yozing...">
        </form>
      </section>

      <section class="mc-scoreboard-container">
        <div id="botScoreboard" class="mc-scoreboard">
          <div class="mc-score-title">Aloqa yo'q</div>
          <div class="mc-score-line">Serverga ulanmoqda...</div>
        </div>
      </section>
    </main>

    <script>
      let socket;
      let connected = false;
      let isPlaying = false;
      let lookYaw = 0;
      let lookPitch = 0;
      const pressedKeys = new Set();
      const keyboardMap = {
        KeyW: 'forward', KeyS: 'back', KeyA: 'left', KeyD: 'right',
        Space: 'jump', ShiftLeft: 'sneak', ShiftRight: 'sneak', ControlLeft: 'sprint', ControlRight: 'sprint'
      };

      const viewerFrame = document.getElementById('viewerFrame');
      const pointerOverlay = document.getElementById('pointerOverlay');
      const crosshair = document.getElementById('crosshair');
      const chatEl = document.getElementById('chat');
      const chatForm = document.getElementById('chatForm');
      const chatInput = document.getElementById('chatInput');
      const overlayTitle = document.getElementById('overlayTitle');

      // Setup WebSocket
      function connect() {
        socket = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`);

        socket.addEventListener('open', () => {
          connected = true;
          overlayTitle.textContent = "O'ynash uchun ekranga bosing";
        });

        socket.addEventListener('close', () => {
          connected = false;
          overlayTitle.textContent = "Aloqa uzildi. Qayta ulanmoqda...";
          document.getElementById('botScoreboard').innerHTML = '<div class="mc-score-title">Aloqa uzildi</div>';
          setTimeout(connect, 1500);
        });

        socket.addEventListener('message', event => {
          const payload = JSON.parse(event.data);

          if (payload.type === 'snapshot') {
            renderStatus(payload.data.status);
            renderChat(payload.data.chat);
            renderViewer(payload.data.viewer);
          }
          if (payload.type === 'status') renderStatus(payload.data);
          if (payload.type === 'chat') appendChat(payload.data);
          if (payload.type === 'viewer') renderViewer(payload.data);
        });
      }

      function sendAction(action) {
        if (!socket || socket.readyState !== WebSocket.OPEN) return;
        socket.send(JSON.stringify(action));
      }

      // Game UI interactions
      pointerOverlay.addEventListener('click', () => {
        if (!isPlaying) pointerOverlay.requestPointerLock();
      });

      document.addEventListener('pointerlockchange', () => {
        isPlaying = document.pointerLockElement === pointerOverlay;
        
        if (isPlaying) {
           pointerOverlay.style.background = 'transparent';
           overlayTitle.style.display = 'none';
           pointerOverlay.querySelector('.subtitle').style.display = 'none';
           crosshair.style.display = 'block';
           chatForm.style.display = 'none';
           chatInput.blur();
        } else {
           pointerOverlay.style.background = 'rgba(0,0,0,0.5)';
           overlayTitle.style.display = 'block';
           pointerOverlay.querySelector('.subtitle').style.display = 'block';
           crosshair.style.display = 'none';
           pressedKeys.clear();
           sendAction({ type: 'control', action: 'stop_all' });
        }
      });

      document.addEventListener('mousemove', (e) => {
        if (!isPlaying) return;
        const sens = 0.003;
        lookYaw -= e.movementX * sens;
        lookPitch -= e.movementY * sens;
        lookPitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, lookPitch));
        
        sendAction({ type: 'control', action: 'look', yaw: lookYaw, pitch: lookPitch });
      });

      pointerOverlay.addEventListener('mousedown', (e) => {
        if (!isPlaying) return;
        e.preventDefault();
        if (e.button === 0) sendAction({ type: 'control', action: 'attack' });
        else if (e.button === 2) sendAction({ type: 'control', action: 'use' });
      });

      pointerOverlay.addEventListener('contextmenu', e => e.preventDefault());

      window.addEventListener('keydown', event => {
        // Handle Chat activation
        if (event.code === 'KeyT' && isPlaying) {
          event.preventDefault();
          document.exitPointerLock();
          chatForm.style.display = 'flex';
          chatInput.focus();
          return;
        }

        if (!isPlaying && document.activeElement !== chatInput) return;
        if (document.activeElement === chatInput) {
            if (event.code === 'Escape') {
                chatInput.blur();
                chatForm.style.display = 'none';
                pointerOverlay.requestPointerLock();
            }
            return;
        }

        const action = keyboardMap[event.code];
        if (!action) return;
        event.preventDefault();
        if (pressedKeys.has(event.code)) return;
        pressedKeys.add(event.code);
        sendAction({ type: 'control', action, active: true });
      });

      window.addEventListener('keyup', event => {
        const action = keyboardMap[event.code];
        if (!action) return;
        event.preventDefault();
        pressedKeys.delete(event.code);
        sendAction({ type: 'control', action, active: false });
      });

      window.addEventListener('blur', () => {
        pressedKeys.clear();
        sendAction({ type: 'control', action: 'stop_all' });
      });

      chatForm.addEventListener('submit', event => {
        event.preventDefault();
        const message = chatInput.value.trim();
        if (message && socket && socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: 'sendChat', message }));
        }
        chatInput.value = '';
        chatInput.blur();
        chatForm.style.display = 'none';
        pointerOverlay.requestPointerLock();
      });

      // Render Functions
      function renderViewer(viewer) {
        if (viewer && viewer.enabled && viewer.started && viewerFrame.src !== viewer.url) {
          viewerFrame.src = viewer.url;
        }
      }

      function renderStatus(status) {
        if (!isPlaying && status.yaw !== undefined) {
          lookYaw = status.yaw;
          lookPitch = status.pitch;
        }

        const scoreboardEl = document.getElementById('botScoreboard');
        if (!scoreboardEl) return;
        scoreboardEl.innerHTML = '';
        
        if (status.scoreboard) {
          const titleEl = document.createElement('div');
          titleEl.className = 'mc-score-title';
          titleEl.innerHTML = parseMinecraftText(status.scoreboard.title || 'Scoreboard');
          scoreboardEl.appendChild(titleEl);

          for (const item of status.scoreboard.items) {
            const lineEl = document.createElement('div');
            lineEl.className = 'mc-score-line';
            lineEl.innerHTML = `<div class="mc-score-name">${parseMinecraftText(item.name)}</div><div class="mc-score-value">${item.value}</div>`;
            scoreboardEl.appendChild(lineEl);
          }
        } else {
          const titleEl = document.createElement('div');
          titleEl.className = 'mc-score-title';
          titleEl.innerHTML = parseMinecraftText('§6Bot Holati');
          scoreboardEl.appendChild(titleEl);

          const stats = [
            { name: '§eNick: §f' + (status.username || '-'), val: '' },
            { name: '§cHP: §f' + (status.health === null ? '-' : `${status.health.toFixed(1)} / ${status.food}`), val: '' },
            { name: '§bPos: §f' + (status.position || '-'), val: '' },
            { name: '§aInv: §f' + (status.inventoryCount || 0), val: '' }
          ];

          for (const stat of stats) {
            const lineEl = document.createElement('div');
            lineEl.className = 'mc-score-line';
            lineEl.innerHTML = `<div class="mc-score-name">${parseMinecraftText(stat.name)}</div><div class="mc-score-value">${stat.val}</div>`;
            scoreboardEl.appendChild(lineEl);
          }
        }
      }

      function renderChat(messages) {
        chatEl.innerHTML = '';
        for (const message of messages) appendChat(message, false);
        chatEl.scrollTop = chatEl.scrollHeight;
      }

      function appendChat(message, shouldScroll = true) {
        const row = document.createElement('div');
        row.className = 'message';
        row.innerHTML = `<div class="text">${message.text}</div>`;
        chatEl.appendChild(row);

        if (chatEl.children.length > 240) chatEl.firstElementChild.remove();
        if (shouldScroll) chatEl.scrollTop = chatEl.scrollHeight;
      }

      function parseMinecraftText(text) {
        if (!text) return '';
        let html = '';
        let activeClasses = [];
        const parts = String(text).split(/(§[0-9a-fk-or])/i);
        
        for (const part of parts) {
          if (/^§[0-9a-fk-or]$/i.test(part)) {
            const code = part.charAt(1).toLowerCase();
            if (code === 'r') {
              html += activeClasses.length > 0 ? '</span>'.repeat(activeClasses.length) : '';
              activeClasses = [];
            } else {
              const className = code >= 'k' && code <= 'o' ? `mc-format-${code}` : `mc-color-${code}`;
              html += `<span class="${className}">`;
              activeClasses.push(className);
            }
          } else if (part) {
            html += escapeHtml(part);
          }
        }
        html += activeClasses.length > 0 ? '</span>'.repeat(activeClasses.length) : '';
        return html;
      }

      function escapeHtml(unsafe) {
        return unsafe
             .replace(/&/g, "&amp;")
             .replace(/</g, "&lt;")
             .replace(/>/g, "&gt;")
             .replace(/"/g, "&quot;")
             .replace(/'/g, "&#039;");
      }

      connect();
    </script>
  </body>
</html>
